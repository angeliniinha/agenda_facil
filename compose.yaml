services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda_local
      POSTGRES_DB: agenda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenda_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://agenda:agenda_local@db:5432/agenda
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  agenda_data:
